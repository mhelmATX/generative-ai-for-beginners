# Fallback only: TaskBoard.xcodeproj is already checked in.
# If it ever gets corrupted, regenerate it with `brew install xcodegen && xcodegen`.
name: TaskBoard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  TaskBoard:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [TaskBoard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TaskBoard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TaskBoard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
